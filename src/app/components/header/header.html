<header>
  <div class="flex flex-row w-full h-18 items-center">
    <div class="pl-10 basis-2/3">
      <a routerLink="/" class="font-merriweather text-[35px] cursor-pointer">
        João Victor Alves da Silva
      </a>
    </div>

    <div class="flex items-center mr-2">
      <span (click)="onToggleTheme()" class="material-symbols-outlined text-2xl cursor-pointer">
        @if (getTheme()) {
          dark_mode
        }@else{
          light_mode
        }
      </span>
    </div>

    <div class="flex basis-1/3 justify-center gap-2.5 items-center text-center">
      <a routerLink="/"
         routerLinkActive="text-text-select bg-selected-color"
         [routerLinkActiveOptions]="{exact: true}"
         class="text-xl font-roboto cursor-pointer p-5 hover:bg-hover font-semibold">Sobre mim</a>

      <a routerLink="/professional"
         routerLinkActive="text-text-select bg-selected-color"
         class="text-xl font-roboto cursor-pointer p-5 hover:bg-hover font-semibold">Experiências profissionais</a>

      <a routerLink="/contact"
         routerLinkActive="text-text-select bg-selected-color"
         class="text-xl font-roboto cursor-pointer p-5 hover:bg-hover font-semibold">Contato</a>
    </div>
  </div>
</header>
